[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guoxin-harness"
version = "0.1.0"
description = "Local preparation and evidence checks for the Guoxin competition"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
guoxin = "guoxin.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
